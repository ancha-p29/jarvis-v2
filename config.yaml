# JARVIS v2 configuration. Edit freely, then restart.
# Relative paths resolve from the project root.

user:
  name: "Praveen"

persona:
  name: "JARVIS"
  address_mode: "sir"        # "sir" | "name" | "none"
  max_spoken_sentences: 3

wakeword:
  model: "hey_jarvis"
  sensitivity: 0.5

stt:
  model: "small"
  language: "en"
  device: "cpu"
  compute_type: "int8"

brain:
  # NO Ollama. Fast hosted OPEN-SOURCE models. "auto" picks the first
  # provider whose API key is set (order: groq, sarvam, openrouter,
  # together, huggingface). Or name one provider directly.
  provider: "auto"
  # Optional per-provider model overrides. Defaults are speed-first:
  #   groq:        openai/gpt-oss-20b          (~1,000 tokens/sec, free key)
  #   sarvam:      sarvam-105b                 (the reel's model family)
  #   openrouter:  meta-llama/llama-3.3-70b-instruct:free
  #   together:    meta-llama/Llama-3.3-70B-Instruct-Turbo
  #   huggingface: meta-llama/Llama-3.1-8B-Instruct
  # Want smarter over faster on Groq? Set groq to openai/gpt-oss-120b
  # or qwen/qwen3-32b.
  models: {}
  temperature: 0.7
  max_tokens: 300          # caps spoken replies, keeps calls snappy
  max_history_turns: 20

tts:
  engine: "piper"
  voice_model: "data/voices/en_US-lessac-medium.onnx"

audio:
  mic_device: null
  speaker_device: null
  sample_rate: 16000

memory:
  dir: "data/memory"
  journal_dir: "data/journal"

# ---- NEW IN V2: PHONE ----
phone:
  # "simulated" = zero accounts, test everything today.
  # "twilio"    = real calls. Set the env vars in .env.example first.
  provider: "simulated"
  port: 8765
  user_phone: "+16174127030"   # Praveen's number, E.164 format
  twilio_number: ""            # or set TWILIO_PHONE_NUMBER env var

# ---- NEW IN V2: DEADLINE WATCHER ----
watcher:
  interval_seconds: 300
  deadlines_file: "data/deadlines.json"
  state_file: "data/watcher_state.json"

# ---- NEW IN V2: LAPTOP TOOLS ----
tools:
  # Folders the find_files / find_resume tools search.
  search_dirs: ["~", "~/Downloads", "~/Documents", "~/Desktop"]
  email_drafts_dir: "data/email_drafts"
  lock_screen_dry_run: true    # safety first. Set false when you trust it.
  open_browser: false          # true lets whatsapp/music tools open links
